[project]
name = "medical-health-system"
version = "1.0.0"
description = "基于多智能体协同的医疗健康咨询与辅助诊断系统"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # FastAPI核心
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    # 数据库
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "redis>=5.0.0",
    # 认证和安全
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=3.0,<4.0",
    "python-multipart>=0.0.6",
    # AI和NLP
    "langchain>=0.1.0",
    "langchain-community>=0.0.20",
    "transformers>=4.35.0",
    "torch>=2.1.0",
    "sentencepiece>=0.1.99",
    "faiss-cpu>=1.7.4",
    # OCR
    "paddlepaddle>=2.5.0",
    "paddleocr>=2.7.0",
    # 异步任务
    "celery>=5.3.0",
    "flower>=2.0.0",
    # 工具库
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "requests>=2.32.0",
    "urllib3>=1.21.1,<2.2.0",
    "charset-normalizer>=2,<3.4",
    "aiofiles>=23.2.0",
    "phonenumbers>=8.13.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.11.0",
    "flake8>=6.1.0",
    "mypy>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.uv.sources]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
